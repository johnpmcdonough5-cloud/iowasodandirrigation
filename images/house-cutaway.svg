<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Cutaway of a home showing spray foam in the roof and walls blocking summer heat while keeping the inside cool">
  <defs>
    <linearGradient id="cSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdeaf1"/><stop offset="1" stop-color="#eaf6f8"/></linearGradient>
    <radialGradient id="cSun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffe0a0"/><stop offset="0.6" stop-color="#ffca66" stop-opacity="0.7"/><stop offset="1" stop-color="#ffca66" stop-opacity="0"/></radialGradient>
    <linearGradient id="cFoam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf6e6"/><stop offset="1" stop-color="#ecdcb8"/></linearGradient>
    <linearGradient id="cIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6f5f8"/><stop offset="1" stop-color="#cfe9ee"/></linearGradient>
  </defs>

  <rect width="640" height="480" fill="url(#cSky)"/>

  <!-- sun + heat -->
  <circle cx="560" cy="80" r="120" fill="url(#cSun)"/>
  <circle cx="560" cy="80" r="42" fill="#ffd873"/>
  <g stroke="#f9a03f" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M470 120 q18 12 0 24 q-18 12 0 24"/>
    <path d="M430 150 q18 12 0 24 q-18 12 0 24"/>
  </g>

  <!-- ground -->
  <rect x="70" y="430" width="500" height="18" fill="#b6cdb0"/>
  <rect x="120" y="428" width="400" height="8" fill="#93704e" opacity="0.5"/>

  <!-- ROOF outer shingles -->
  <path d="M92 246 L320 84 L548 246 L512 246 L320 128 L128 246 Z" fill="#3a4f5b"/>
  <path d="M320 84 L332 92 L320 100 L308 92 Z" fill="#4c6572"/>

  <!-- ROOF foam layer -->
  <path d="M128 246 L320 128 L512 246 L482 246 L320 160 L158 246 Z" fill="url(#cFoam)"/>
  <g fill="#fffdf6" opacity="0.7"><circle cx="220" cy="205" r="7"/><circle cx="410" cy="205" r="7"/><circle cx="300" cy="175" r="6"/></g>
  <g fill="#ddcaa0" opacity="0.6"><circle cx="260" cy="220" r="6"/><circle cx="370" cy="222" r="6"/></g>

  <!-- attic interior -->
  <path d="M158 246 L320 160 L482 246 Z" fill="url(#cIn)"/>

  <!-- house body -->
  <rect x="150" y="246" width="340" height="186" fill="#2f4450"/>       <!-- exterior wall shell -->
  <!-- interior -->
  <rect x="172" y="246" width="296" height="186" fill="url(#cIn)"/>
  <!-- wall foam layers (inside of exterior walls) -->
  <rect x="150" y="246" width="22" height="186" fill="url(#cFoam)"/>
  <rect x="468" y="246" width="22" height="186" fill="url(#cFoam)"/>
  <g fill="#ddcaa0" opacity="0.55"><circle cx="161" cy="300" r="5"/><circle cx="161" cy="360" r="5"/><circle cx="479" cy="300" r="5"/><circle cx="479" cy="360" r="5"/></g>
  <g fill="#fffdf6" opacity="0.7"><circle cx="161" cy="330" r="5"/><circle cx="479" cy="330" r="5"/></g>

  <!-- floor divider -->
  <rect x="172" y="336" width="296" height="8" fill="#b9c9cf"/>

  <!-- interior details: windows + door -->
  <rect x="210" y="278" width="46" height="40" rx="3" fill="#bfe0e6" stroke="#8fb6bd" stroke-width="2"/>
  <rect x="384" y="278" width="46" height="40" rx="3" fill="#bfe0e6" stroke="#8fb6bd" stroke-width="2"/>
  <rect x="300" y="372" width="40" height="60" rx="3" fill="#9fb9c0"/>

  <!-- comfort badge -->
  <g>
    <rect x="276" y="356" width="88" height="40" rx="20" fill="#0b7a8c"/>
    <text x="330" y="382" font-family="Poppins, Arial, sans-serif" font-weight="700" font-size="20" fill="#ffffff">72°F</text>
    <g transform="translate(296 376)" stroke="#bff0f7" stroke-width="2.4" stroke-linecap="round">
      <line x1="0" y1="-8" x2="0" y2="8"/><line x1="-7" y1="-4" x2="7" y2="4"/><line x1="7" y1="-4" x2="-7" y2="4"/>
    </g>
  </g>

  <!-- heat blocked indicator on roof -->
  <g stroke="#f97316" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M400 150 l-26 20"/><path d="M430 175 l-26 20"/>
  </g>
  <g fill="#f97316" opacity="0.85"><circle cx="372" cy="172" r="4"/><circle cx="402" cy="197" r="4"/></g>
</svg>
