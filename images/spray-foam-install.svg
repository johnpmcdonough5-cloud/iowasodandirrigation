<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="A technician applying closed-cell spray foam insulation between wall studs">
  <defs>
    <linearGradient id="sfBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2530"/><stop offset="1" stop-color="#071820"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a5a3e"/><stop offset="0.5" stop-color="#93704e"/><stop offset="1" stop-color="#5e4530"/>
    </linearGradient>
    <linearGradient id="woodTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c7853"/><stop offset="1" stop-color="#6b4f37"/>
    </linearGradient>
    <linearGradient id="foam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6e6"/><stop offset="1" stop-color="#e6d3ab"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.7" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.35"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mist" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#eaf7fb" stop-opacity="0.9"/><stop offset="1" stop-color="#eaf7fb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="640" height="480" fill="url(#sfBg)"/>
  <rect width="640" height="480" fill="url(#warm)"/>

  <!-- top & bottom plates -->
  <rect x="40" y="44" width="560" height="40" fill="url(#woodTop)"/>
  <rect x="40" y="44" width="560" height="6" fill="#b8946b" opacity="0.6"/>
  <rect x="40" y="404" width="560" height="40" fill="url(#woodTop)"/>
  <rect x="40" y="404" width="560" height="6" fill="#b8946b" opacity="0.6"/>

  <!-- vertical studs -->
  <g>
    <rect x="70"  y="84" width="34" height="320" fill="url(#wood)"/>
    <rect x="228" y="84" width="34" height="320" fill="url(#wood)"/>
    <rect x="386" y="84" width="34" height="320" fill="url(#wood)"/>
    <rect x="536" y="84" width="34" height="320" fill="url(#wood)"/>
    <!-- grain hints -->
    <g stroke="#5e4530" stroke-width="1.4" opacity="0.5">
      <line x1="87" y1="90" x2="87" y2="398"/><line x1="245" y1="90" x2="245" y2="398"/>
      <line x1="403" y1="90" x2="403" y2="398"/><line x1="553" y1="90" x2="553" y2="398"/>
    </g>
  </g>

  <!-- FOAM in bay 1 (fully applied) fills 102..230 -->
  <g>
    <path d="M100 104 q10 -9 20.5 0 q10 -9 20.5 0 q10 -9 20.5 0 q10 -9 20.5 0 q10 -9 20.5 0 q10 -9 22 0 L232 402 L100 402 Z" fill="url(#foam)"/>
    <g fill="#fffdf6" opacity="0.7"><circle cx="132" cy="150" r="13"/><circle cx="196" cy="196" r="15"/><circle cx="150" cy="300" r="12"/><circle cx="205" cy="128" r="9"/><circle cx="128" cy="360" r="11"/></g>
    <g fill="#d3bd91" opacity="0.55"><circle cx="170" cy="176" r="11"/><circle cx="122" cy="240" r="10"/><circle cx="200" cy="290" r="12"/><circle cx="165" cy="360" r="11"/><circle cx="150" cy="220" r="9"/></g>
  </g>

  <!-- FOAM in bay 2 (fully applied) fills 260..388 -->
  <g>
    <path d="M258 104 q10 -9 20.5 0 q10 -9 20.5 0 q10 -9 20.5 0 q10 -9 20.5 0 q10 -9 20.5 0 q10 -9 22 0 L390 402 L258 402 Z" fill="url(#foam)"/>
    <g fill="#fffdf6" opacity="0.7"><circle cx="290" cy="150" r="13"/><circle cx="356" cy="210" r="15"/><circle cx="308" cy="320" r="12"/><circle cx="366" cy="132" r="9"/><circle cx="286" cy="362" r="11"/></g>
    <g fill="#d3bd91" opacity="0.55"><circle cx="330" cy="180" r="11"/><circle cx="284" cy="248" r="10"/><circle cx="360" cy="300" r="12"/><circle cx="322" cy="368" r="11"/><circle cx="306" cy="230" r="9"/></g>
  </g>

  <!-- FOAM in bay 3 (being applied - fills from top with wavy leading edge) 418..536 -->
  <g>
    <path d="M416 104 q10 -9 19.8 0 q10 -9 19.8 0 q10 -9 19.8 0 q10 -9 19.8 0 q10 -9 19.8 0 q10 -9 21 0 L536 244 q-18 18 -36 7 q-18 13 -37 5 q-16 12 -31 3 Z" fill="url(#foam)"/>
    <g fill="#fffdf6" opacity="0.7"><circle cx="452" cy="150" r="13"/><circle cx="502" cy="176" r="14"/><circle cx="470" cy="212" r="11"/></g>
    <g fill="#d3bd91" opacity="0.55"><circle cx="488" cy="140" r="9"/><circle cx="456" cy="200" r="9"/><circle cx="512" cy="210" r="8"/></g>
  </g>

  <!-- spray mist cone from gun to bay 3 -->
  <g>
    <path d="M566 372 L470 250 L510 250 Z" fill="url(#mist)" opacity="0.55"/>
    <g fill="#eaf7fb"><circle cx="488" cy="262" r="3.2" opacity="0.9"/><circle cx="505" cy="248" r="2.6" opacity="0.8"/><circle cx="472" cy="278" r="2.4" opacity="0.75"/><circle cx="500" cy="285" r="2.2" opacity="0.7"/><circle cx="520" cy="268" r="2" opacity="0.6"/><circle cx="486" cy="300" r="2.6" opacity="0.7"/><circle cx="515" cy="300" r="2" opacity="0.55"/><circle cx="533" cy="290" r="1.8" opacity="0.5"/></g>
  </g>

  <!-- hose -->
  <path d="M560 470 C 610 430 600 400 574 384" fill="none" stroke="#111a22" stroke-width="16" stroke-linecap="round"/>
  <path d="M560 470 C 610 430 600 400 574 384" fill="none" stroke="#25313c" stroke-width="8" stroke-linecap="round"/>

  <!-- spray gun -->
  <g transform="rotate(-38 566 372)">
    <rect x="540" y="356" width="74" height="34" rx="10" fill="#28323d"/>
    <rect x="540" y="356" width="74" height="12" rx="6" fill="#3c4a57"/>
    <!-- barrel/tip -->
    <rect x="612" y="362" width="30" height="22" rx="4" fill="#8f9ba6"/>
    <rect x="640" y="366" width="12" height="14" rx="3" fill="#c3ccd4"/>
    <!-- handle -->
    <path d="M556 388 q-6 30 8 44 l14 -2 q-8 -22 -4 -42 z" fill="#1c242c"/>
    <!-- trigger -->
    <path d="M572 392 q10 8 6 22" fill="none" stroke="#f97316" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- cool rim light on studs -->
  <g stroke="#22d3ee" stroke-width="2" opacity="0.18">
    <line x1="104" y1="90" x2="104" y2="400"/><line x1="262" y1="90" x2="262" y2="400"/><line x1="420" y1="90" x2="420" y2="400"/>
  </g>
</svg>
